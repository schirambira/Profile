<!DOCTYPE html>

<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>JSP Page</title>
        <link rel="stylesheet" type="text/css" href="css/style.css">
        
        <style>
            :root {
                --gbcolval: #3498db; /* Global variable */
                --pdval: 8px;
                --colnn: 2;
            }
            #divmaincontainer{
                width:80%;
                margin: auto;
            }
            table {
                border: 1px solid orange;
                border-collapse: collapse;
            } 
            tr td{
                border:1px solid var(--gbcolval, orange); /* orange: default if var is undefined*/
                padding: var(--pdval, 0);
            }
            tr:first-child,
            td:first-child{
                background-color: lightcyan;
            }
            tr:first-child>td:first-child{
                /*content: "X"; :before */ 
                color: crimson;
                text-transform: uppercase;
            }   
            tr:nth-child(n+2):hover{ /* n starts from 0 so n+2 = 2 skipping row 1 */
                background-image: linear-gradient(to bottom right, yellow, lightcyan, greenyellow); /* 45deg to right, to left etc */
            }
            .square{
                border-image: radial-gradient(cyan, greenyellow, yellow, pink);
                border: 2px solid coral;
            }
            
            /* Highlights all cells in the hovered column (requires :has support) */
            /* this works, but JS solution looks shorter 
            table:has( td:nth-child(1):hover ) td:nth-child(1),
            table:has( td:nth-child(2):hover ) td:nth-child(2),
            table:has( td:nth-child(3):hover ) td:nth-child(3),
            table:has( td:nth-child(4):hover ) td:nth-child(4),
            table:has( td:nth-child(5):hover ) td:nth-child(5),
            table:has( td:nth-child(6):hover ) td:nth-child(6),
            table:has( td:nth-child(7):hover ) td:nth-child(7),
            table:has( td:nth-child(8):hover ) td:nth-child(8),
            table:has( td:nth-child(9):hover ) td:nth-child(9) {
                background-image: linear-gradient(to bottom right, yellow, greenyellow); /* 45deg to right, to left etc /*
            }
            */
            


        </style>
    </head>
    <body>
        
        <div id="divmaincontainer">

            <h1>Multiplication Table</h1>

            <label for="start" class="lbl">Start</label>
            <input type="number" id="start" name="start" placeholder="Start" required  oninvalid="this.setCustomValidity('Please Enter Start Value Here')" oninput="this.setCustomValidity('')" value="0">

            <label for="end" class="lbl">End</label>
            <input type="number" id="end" name="end" class="txt" placeholder="End" required  oninvalid="this.setCustomValidity('Please Enter End Value Here')" oninput="this.setCustomValidity('')" value="30">
            <input type="button" value="Re-Load" onclick="LoadTable()" >
            <br>
            <br>

            
            <h1>Multiplication Table</h1>

            <div id="divtable">
                
                <script>

                    //check dom content loaded
                    //for js loaded pages - The DOMContentLoaded event is likely not firing for a dynamically loaded script because the event has already occurred by the time the script is executed
                    if (document.readyState !== 'loading') {
                        // DOM is already ready (interactive or complete), run the function immediately
                        LoadTable();
                    } else {
                        // DOM is still loading, wait for the event
                        document.addEventListener('DOMContentLoaded', LoadTable() );
                    }
                    
                    
                    function LoadTable(){
                        var start = Number(document.querySelector("#start").value); //start
                        var end = Number(document.querySelector("#end").value); //end

                        var tbl="";
                        tbl += "<table>"
                            for(var j=start; j<=end; j++){
                                tbl += "<tr>";
        
                                for(var k=start; k<=end; k++){ 
                                    var cls = (j == k) ? "class='square'" : "";
                                    tbl += `<td ${cls}
                                            onmouseover="HighlightColumn(this.cellIndex+1, true)"  
                                            onmouseout="HighlightColumn(this.cellIndex+1, false)"
                                            onclick= "if(this.parentNode.rowIndex * this.cellIndex > 0){ alert( ${j} + '  ❌ ' + ${k} + ' 🟰 ' + this.innerText); }"  >`;  

                                    tbl += (j==start && k==start ? "X" : j==start ? k : k==start ? j : j*k); //header row and column
                                    tbl += "</td>";
                                }
        
                                tbl += "</tr>";
                            }
                        tbl += "</table>";
                        document.getElementById("divtable").innerHTML = tbl;
                        
                    };

    
                </script>   

            </div>
            
        </div>
        
    </body>

        <script>

            //onmouseover="document.documentElement.style.setProperty('--coln', this.cellIndex);";

            const HighlightColumn = (colIndex, flag) => { 
                if(colIndex === 1) { return; } //prevent first / header column
                elems = [...document.querySelectorAll(`td:nth-child(${colIndex})`)];
                elems.forEach( (element, i)=> { if(i===0){ return; } //skip first row
                    // Perform an action on each element
                    element.style.backgroundImage = (flag===true)? "linear-gradient(to right, yellow, lightcyan, greenyellow)" : "none"; //backgroundColor = "greenyellow" : "transparent";
                });
        
            }; 
            
        </script>

    
</html>
